<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>쓰레기 인식 테스트</title>

  <!-- 스타일 -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #222;
      overflow: hidden;
    }

    h1 {
      color: #0066ff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      width: 90%;
      max-width: 380px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background-color: #0066ff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background-color: #0051cc; }

    #cameraSection {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100vh;
      justify-content: center;
      background: #000;
      position: relative;
    }

    video {
      border-radius: 12px;
      width: 90vw;
      max-width: 400px;
      height: auto;
      object-fit: cover;
    }

    #resultBox {
      position: absolute;
      bottom: 10%;
      background: rgba(255,255,255,0.85);
      border-radius: 16px;
      padding: 10px 20px;
      font-size: 20px;
      font-weight: 600;
      color: #0066ff;
    }

    #backBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!-- 첫 화면 -->
  <div class="card" id="mainMenu">
    <h1>기계 선택</h1>
    <p>테스트할 기계를 선택하세요</p>
    <button onclick="selectMachine(1)">1번 기계</button>
    <button onclick="selectMachine(2)">2번 기계</button>
    <button onclick="selectMachine(3)">3번 기계</button>
  </div>

  <!-- 카메라 화면 -->
  <div id="cameraSection">
    <button id="backBtn" onclick="goHome()">← 뒤로</button>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="resultBox">인식 중...</div>
  </div>

  <!-- Teachable Machine & Firebase -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyALgWwQfaOZL-s3JbjWxM9Y9YL5fdsSQv4",
      authDomain: "iot-team-1643a.firebaseapp.com",
      databaseURL: "https://iot-team-1643a-default-rtdb.firebaseio.com",
      projectId: "iot-team-1643a",
      storageBucket: "iot-team-1643a.firebasestorage.app",
      messagingSenderId: "198716312891",
      appId: "1:198716312891:web:3a4f625784a3b65d6efb1e",
      measurementId: "G-BNYKB16H85"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const URL = "./model/"; // 모델 폴더
    let model, webcam;
    let currentMachine = 0;
    let detecting = false;

    // 기계 선택
    window.selectMachine = async function(num) {
      currentMachine = num;
      document.getElementById("mainMenu").style.display = "none";
      document.getElementById("cameraSection").style.display = "flex";
      document.body.style.background = "#000";
      await initModel();
      startDetection();
    };

    // 홈으로 돌아가기
    window.goHome = function() {
      detecting = false;
      if (webcam) webcam.stop();
      document.getElementById("cameraSection").style.display = "none";
      document.getElementById("mainMenu").style.display = "block";
      document.body.style.background = "#f5f7fa";
    };

    // 모델 초기화
    async function initModel() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      model = await tmImage.load(modelURL, metadataURL);

      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup();
      await webcam.play();

      document.getElementById("webcam").srcObject = webcam.webcam;
    }

    // 감지 루프 시작
    async function startDetection() {
      detecting = true;
      while (detecting) {
        webcam.update();
        await predict();
        await new Promise(r => setTimeout(r, 500)); // 0.5초마다 업데이트
      }
    }

    // 예측 및 Firebase 저장
    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let top = prediction.reduce((a, b) => a.probability > b.probability ? a : b);
      const resultBox = document.getElementById("resultBox");
      resultBox.textContent = `${top.className} (${(top.probability * 100).toFixed(0)}%)`;

      set(ref(db, `machine_${currentMachine}`), {
        detected: top.className,
        confidence: (top.probability * 100).toFixed(1),
        timestamp: Date.now()
      });
    }
  </script>
</body>
</html>
