<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>공원 순찰 쓰레기통</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 30px;
      text-align: center;
    }

    .machine-select {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .machine-btn {
      background: linear-gradient(135deg, #007aff, #00c6ff);
      border: none;
      border-radius: 16px;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: 600;
      width: 200px;
      transition: transform 0.15s ease;
    }
    .machine-btn:active {
      transform: scale(0.96);
    }

    #camera-page {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    video {
      width: 90vw;
      max-width: 400px;
      height: auto;
      border-radius: 16px;
      background: #111;
      object-fit: cover;
    }

    #result {
      margin-top: 20px;
      background: rgba(255,255,255,0.85);
      color: #007aff;
      font-weight: 600;
      font-size: 22px;
      padding: 10px 20px;
      border-radius: 16px;
    }

    #back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- ✅ 기계 선택 화면 -->
  <div id="select-page">
    <h1>기계를 선택하세요</h1>
    <div class="machine-select">
      <button class="machine-btn" onclick="startCamera('machine_1')">1번 기계</button>
      <button class="machine-btn" onclick="startCamera('machine_2')">2번 기계</button>
      <button class="machine-btn" onclick="startCamera('machine_3')">3번 기계</button>
    </div>
  </div>

  <!-- ✅ 카메라 화면 -->
  <div id="camera-page">
    <button id="back-btn" onclick="goHome()">← 뒤로</button>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="result">카메라 준비 중...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyALgWwQfaOZL-s3JbjWxM9Y9YL5fdsSQv4",
      authDomain: "iot-team-1643a.firebaseapp.com",
      databaseURL: "https://iot-team-1643a-default-rtdb.firebaseio.com",
      projectId: "iot-team-1643a",
      storageBucket: "iot-team-1643a.firebasestorage.app",
      messagingSenderId: "198716312891",
      appId: "1:198716312891:web:3a4f625784a3b65d6efb1e",
      measurementId: "G-BNYKB16H85"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const URL = "./model/"; // Teachable Machine 모델 폴더
    let model, webcamStream, selectedMachine = "";

    const selectPage = document.getElementById("select-page");
    const cameraPage = document.getElementById("camera-page");
    const video = document.getElementById("webcam");
    const result = document.getElementById("result");

    async function startCamera(machineName) {
      selectedMachine = machineName;
      selectPage.style.display = "none";
      cameraPage.style.display = "flex";

      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = webcamStream;
      } catch (err) {
        result.textContent = "카메라 접근 실패: " + err.message;
        return;
      }

      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      result.textContent = "모델 불러오는 중...";
      model = await tmImage.load(modelURL, metadataURL);
      result.textContent = "인식 준비 완료";

      startPrediction();
    }

    async function startPrediction() {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      async function loop() {
        if (video.readyState === 4) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const prediction = await model.predict(canvas);
          let top = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

          result.textContent = `${top.className} (${(top.probability * 100).toFixed(1)}%)`;

          await set(ref(db, selectedMachine), {
            detected: top.className,
            confidence: (top.probability * 100).toFixed(1),
            timestamp: Date.now()
          });
        }
        setTimeout(loop, 500);
      }
      loop();
    }

    window.goHome = function() {
      if (webcamStream) webcamStream.getTracks().forEach(track => track.stop());
      cameraPage.style.display = "none";
      selectPage.style.display = "flex";
      result.textContent = "카메라 준비 중...";
    };
  </script>
</body>
</html>
