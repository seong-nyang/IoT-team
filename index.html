<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>쓰레기 인식 테스트</title>

  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 90vw;
      max-width: 400px;
      height: auto;
      border-radius: 12px;
      background: #111;
      object-fit: cover;
    }

    #result {
      margin-top: 20px;
      background: rgba(255,255,255,0.85);
      color: #0066ff;
      font-weight: 600;
      font-size: 22px;
      padding: 10px 20px;
      border-radius: 16px;
    }

    button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <button onclick="goHome()">← 뒤로</button>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="result">카메라 준비 중...</div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyALgWwQfaOZL-s3JbjWxM9Y9YL5fdsSQv4",
      authDomain: "iot-team-1643a.firebaseapp.com",
      databaseURL: "https://iot-team-1643a-default-rtdb.firebaseio.com",
      projectId: "iot-team-1643a",
      storageBucket: "iot-team-1643a.firebasestorage.app",
      messagingSenderId: "198716312891",
      appId: "1:198716312891:web:3a4f625784a3b65d6efb1e",
      measurementId: "G-BNYKB16H85"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const URL = "./model/"; // Teachable Machine 모델 폴더
    let model, webcamStream;

    async function init() {
      const video = document.getElementById("webcam");
      const result = document.getElementById("result");

      try {
        // 모바일 카메라 우선 (후면)
        webcamStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = webcamStream;
      } catch (err) {
        result.textContent = "카메라 접근 실패: " + err.message;
        return;
      }

      // 모델 로드
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      result.textContent = "모델 불러오는 중...";
      model = await tmImage.load(modelURL, metadataURL);
      result.textContent = "인식 준비 완료";

      startPrediction(video, result);
    }

    async function startPrediction(video, result) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      async function loop() {
        if (video.readyState === 4) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const prediction = await model.predict(canvas);
          let top = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

          result.textContent = `${top.className} (${(top.probability * 100).toFixed(1)}%)`;

          // Firebase 업로드
          await set(ref(db, "machine_1"), {
            detected: top.className,
            confidence: (top.probability * 100).toFixed(1),
            timestamp: Date.now()
          });
        }
        setTimeout(loop, 500); // 0.5초마다 갱신
      }
      loop();
    }

    // 뒤로가기 버튼 (카메라 정리)
    window.goHome = function() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        alert("카메라 종료됨");
      }
    };

    init();
  </script>
</body>
</html>
